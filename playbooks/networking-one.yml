- name: Network one topology
  hosts: netlab
  become: true # run as root
  tasks:
    - name: Create namespace red
      ansible.builtin.command:
        cmd: ip netns add red
        creates: /run/netns/red

    - name: Check if eth0 exists in red
      ansible.builtin.command: ip -n red link show eth0
      register: red_eth0
      changed_when: false
      failed_when: false
    - name: Create veth pair veth-red <-> eth0 (inside red)
      ansible.builtin.command: ip link add veth-red type veth peer name eth0 netns red
      when: red_eth0.rc != 0
      changed_when: true

    - name: Check if eth0 in red is up
      ansible.builtin.command: ip -n red link show eth0 up
      register: red_eth0_up
      changed_when: false
    - name: Bring eth0 in red up
      ansible.builtin.command: ip -n red link set eth0 up
      when: red_eth0_up.stdout == ""
      changed_when: true

    - name: Read IPv4 addresses of eth0 in red
      ansible.builtin.command: ip -n red -4 -o addr show dev eth0
      register: red_eth0_addr
      changed_when: false
    - name: Assign 10.0.0.1/24 to eth0 in red
      ansible.builtin.command: ip -n red addr add 10.0.0.1/24 dev eth0
      when: "'10.0.0.1/24' not in red_eth0_addr.stdout"
      changed_when: true
