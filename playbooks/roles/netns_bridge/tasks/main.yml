- name: Create namespace | {{ netns_bridge_namespace }}
  ansible.builtin.command:
    cmd: ip netns add {{ netns_bridge_namespace }}
    creates: /run/netns/{{ netns_bridge_namespace }}

- name: Check if bridge exists | {{ netns_bridge_name ~ '/' ~ netns_bridge_namespace }}
  ansible.builtin.command: >-
    ip -n {{ netns_bridge_namespace }} link show {{ netns_bridge_name }}
  register: netns_bridge_link
  changed_when: false
  failed_when: false

- name: Create bridge | {{ netns_bridge_name ~ '/' ~ netns_bridge_namespace }}
  ansible.builtin.command: >-
    ip -n {{ netns_bridge_namespace }} link add {{ netns_bridge_name }} type bridge
  when: netns_bridge_link.rc != 0
  changed_when: true

- name: Check if bridge is up | {{ netns_bridge_name ~ '/' ~ netns_bridge_namespace }}
  ansible.builtin.command: >-
    ip -n {{ netns_bridge_namespace }} link show {{ netns_bridge_name }} up
  register: netns_bridge_up
  changed_when: false

- name: Bring bridge up | {{ netns_bridge_name ~ '/' ~ netns_bridge_namespace }}
  ansible.builtin.command: >-
    ip -n {{ netns_bridge_namespace }} link set {{ netns_bridge_name }} up
  when: netns_bridge_up.stdout == ""
  changed_when: true

- name: Attach port | {{ netns_bridge_name ~ '/' ~ netns_bridge_namespace }}
  ansible.builtin.include_tasks: port.yml
  loop: "{{ netns_bridge_ports }}"
  loop_control:
    loop_var: netns_bridge_port
