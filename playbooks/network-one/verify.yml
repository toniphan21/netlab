- name: Verify
  tags: [never, verify]
  block:
    - name: Verify status
      ansible.builtin.command: "{{ item }}"
      loop:
        - ip -n sw -br link
        - ip -n red -br addr
        - ip -n blue -br addr
      register: netlab_status
      changed_when: false
    - name: Show status output
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ netlab_status.results }}"
      loop_control:
        label: "{{ item.cmd | join(' ') }}"

    - name: Verify ping all ways
      ansible.builtin.include_tasks: ../tasks/ping.yml
      loop:
        - [red, blue]
        - [red, green]
        - [blue, red]
        - [blue, green]
        - [green, red]
        - [green, blue]
        - [red, red] # loopback
        - [blue, blue] # loopback
        - [green, green] # loopback
      loop_control:
        loop_var: ping_pair
