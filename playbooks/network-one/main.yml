- name: Network one topology
  hosts: netlab
  become: true # run as root
  gather_facts: false
  pre_tasks:
    - name: Install network tools
      ansible.builtin.apt:
        name:
          - iputils-ping
          - tcpdump
        update_cache: true
        cache_valid_time: 3600
  vars:
    ips: { red: 10.0.0.1, blue: 10.0.0.2, green: 10.0.0.3, yellow: 10.0.0.4 }
  roles:
    - role: netns_veth
      netns_veth_namespace: red
      netns_veth_peer: red-sw
      netns_veth_peer_namespace: sw
      netns_veth_address: "{{ ips.red ~ '/24' }}"

    - role: netns_veth
      netns_veth_namespace: blue
      netns_veth_peer: blue-sw
      netns_veth_peer_namespace: sw
      netns_veth_address: "{{ ips.blue ~ '/24' }}"

    - role: netns_veth
      netns_veth_namespace: green
      netns_veth_peer: green-sw
      netns_veth_peer_namespace: sw
      netns_veth_address: "{{ ips.green ~ '/24' }}"

    - role: netns_bridge
      netns_bridge_namespace: sw
      netns_bridge_ports:
        - red-sw
        - blue-sw
        - green-sw

  post_tasks:
    - name: Verify
      ansible.builtin.import_tasks: ./verify.yml
      tags: [never, verify]

    - name: Clean up
      ansible.builtin.import_tasks: ./clear.yml
      tags: [never, clear]

    - name: ARP
      ansible.builtin.import_tasks: ./arp.yml
      tags: [never, arp]
